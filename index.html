<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Daily Brief</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="https://www.rp.edu.sg/" aria-label="Republic Polytechnic">
        <img src="assets/republic-polytechnic-logo.jpg" alt="Republic Polytechnic">
      </a>
      <p>School of Infocomm</p>
    </div>
  </header>

  <main class="dashboard">
    <section class="hero" aria-label="Brief heading">
      <div class="hero-copy">
        <p class="eyebrow">Diploma in Applied AI and Analytics</p>
        <h1 id="brief-title">Loading brief</h1>
        <p id="brief-meta" class="meta">Preparing dashboard</p>
      </div>
    </section>

    <section class="brief-shell" aria-label="Generated brief">
      <article id="brief-content" class="brief-content">
        <p>Loading the latest available brief.</p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-line">Made using the tools we teach, practise, and build with.</p>
    <p class="footer-tools">n8n | GitHub | VS Code | OpenRouter models</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
